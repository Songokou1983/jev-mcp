[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-mcp"
version = "0.2.0"
description = "Local MCP server exposing TypeSafe Jev as native Claude Code tools (Plan v2)"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "son_goku"},
]
keywords = ["mcp", "claude-code", "typesafe", "jev", "decision-model"]
license = {text = "MIT"}

dependencies = [
    "mcp<2",                # FastMCP 1.x API; mcp 2.x renamed FastMCP to MCPServer
    "httpx>=0.27",          # direct /v1/systemone calls (no typesafe-sdk — we own retry policy)
    "uvicorn>=0.30",        # ASGI server for HTTP transport
    "tenacity>=8.2",        # 429/529 exponential backoff
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "respx>=0.20",          # mock httpx for unit tests
]

[project.scripts]
jev-mcp = "jev_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:mcp",
]